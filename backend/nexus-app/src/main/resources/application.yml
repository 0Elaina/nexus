server:
  port: 8080

spring:
  application:
    name: nexus
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/blogdb;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password:

  # Redis 连接池配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8 # 最大连接数
          max-idle: 8 # 最大空闲连接
          min-idle: 0 # 最小空闲连接
          max-wait: -1ms # 连接池最大阻塞等待时间（-1 为无限等待）

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: utf-8

logging:
  level:
    root: INFO
    com.nep: DEBUG
  file:
    name: ./logs/blog.log
  logback:
    rollingpolicy:
      file-name-pattern: ./logs/blog-%d{yyyy-MM-dd}.%i.log
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n"

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

nexus:
  jwt:
    # 优先从环境变量或 -local.yml 获取，兜底为空
    secret: ${NEXUS_JWT_SECRET:}
    expire-ms: ${NEXUS_JWT_EXPIRE_MS:604800000}
